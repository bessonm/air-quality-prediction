[project]
name = "air-quality-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mael Besson", email = "3458542+bessonm@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
air-quality-prediction = "air_quality_prediction:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
